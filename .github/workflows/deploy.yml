name: Deploy Backend to Remote Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: SSH & Execute Deploy Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SSH to Server & Run Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Connected to server. Executing deploy.sh..."
            chmod +x /apps/attendance/deploy.sh
            /apps/attendance/deploy.sh
